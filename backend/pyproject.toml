[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Web API with JWT authentication and refresh flow"
authors = [{name = "Baufest Internal", email = "devnull@example.com"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
	"fastapi>=0.115.12,<0.116.0",
	"uvicorn[standard]>=0.34.3,<0.35.0",
	"passlib[bcrypt]>=1.7.4,<2.0.0",
	"bcrypt>=3.2,<4.0",
	"PyJWT>=2.10.1,<3.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"